<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>

:root[data-theme="dark"]{--bg:#11161c;--pn:#1a222b;--ink:#e6ebf0;--mu:#9aa7b4;--ln:#2d3a47;--ac:#7db3e6;--acx:#0d1720;--go:#34c58a;--bad:#f0895a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{padding:14px 18px 4px}h1{margin:0;font-size:20px}h2{font-size:14px;margin:16px 0 6px}h2 small{color:var(--mu);font-weight:400;margin-left:6px}
.wrap{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:10px 18px 24px;align-items:start}
@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:8px 10px}}
aside,main{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 14px 14px}
aside{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}@media(max-width:820px){aside{position:static;max-height:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
button{font:inherit;color:inherit;cursor:pointer}
.chip,.tp,.tab,.seg button,.ct{border:1px solid var(--ln);background:var(--pn);border-radius:16px;padding:3px 11px}
.tp{padding:1px 8px;font-size:13px;border-radius:6px}
.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--ln);margin-top:8px;position:sticky;top:0;background:var(--pn)}
#tl{max-height:230px;overflow:auto;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
input[type=search],select{font:inherit;padding:5px 8px;border:1px solid var(--ln);border-radius:6px;background:var(--pn);color:var(--ink);width:100%;margin:4px 0 8px}
.tabs{display:flex;gap:6px;margin:6px 0 10px}.tab{border-radius:8px;padding:6px 14px}
.ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:10px;color:var(--mu)}.ctl b{color:var(--ink)}
.seg{display:inline-flex;gap:4px}.seg button,.ct{border-radius:6px;padding:1px 10px}
.scroll{overflow-x:auto}table.g{border-collapse:separate;border-spacing:3px;width:100%;min-width:520px;table-layout:fixed}
.g th{font-weight:500;font-size:13px;color:var(--mu);width:64px}.g th small{font-size:11px}.g td{vertical-align:top;padding:0}
tr.lunch td,tr.lunch th{padding-top:9px}
.m{width:100%;height:46px;border:1px solid var(--ln);border-radius:6px;font-weight:700;font-size:16px;background:color-mix(in srgb,var(--go) calc(var(--f)*70%),var(--pn))}
.m i{font-weight:400;font-size:12px;font-style:normal;opacity:.7}
.m.ok{outline:3px solid var(--go);outline-offset:-1px}.m.sel{box-shadow:0 0 0 3px var(--ac)}
.cell{min-height:52px;font-size:12.5px;line-height:1.35;padding:4px 6px;border:1px solid var(--ln);border-radius:6px}.cell b{font-weight:500}.cell a{color:var(--ac);cursor:pointer;margin-right:5px}.cell small{color:var(--mu);display:block}
.cell.e{border-style:dashed;opacity:.5}
ul.r{list-style:none;padding:0;margin:6px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
ul.r button{width:100%;text-align:left;border:1px solid var(--go);border-radius:8px;background:var(--pn);padding:6px 10px}ul.r small{display:block;color:var(--mu)}

.hint{color:var(--mu);padding:20px 4px}.det{border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin-top:10px}.det .bz{color:var(--bad)}.det .fr{color:var(--mu);font-size:13px}
</style></head><body>
<header><h1>課表檢視・開會時間挑選</h1></header>
<div class="wrap"><aside>
<h2>1. 選範圍<small>可多選，再按一次取消</small></h2><div class="chips" id="c1"></div>

<h2>3. 個別微調<small>點名字加入／移除</small></h2>
<input type="search" id="q" placeholder="搜尋老師姓名"><div id="tl"></div>
<div class="bar"><span id="cnt"></span><button class="ct" data-a="clr">全部清除</button></div>
</aside><main>
<div class="tabs"><button class="tab on" data-a="tab" data-k="meet">開會時間</button><button class="tab" data-a="tab" data-k="cls">班級課表</button><button class="tab" data-a="tab" data-k="tea">教師課表</button><button class="tab" data-a="tab" data-k="slot">某節有誰上課</button><button class="tab" data-a="tab" data-k="fr">某節誰沒課</button></div>

const T={};C.forEach(c=>c.x.forEach(([p,d,s,r,ts])=>ts.forEach(n=>{const t=T[n]||(T[n]={busy:{},tch:[]}),k=d+'_'+p;(t.busy[k]||(t.busy[k]=[])).push({c:c.n,s});t.tch.push([c.g,c.b,cat(s)])})));
const names=Object.keys(T).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
const S={sc:new Set(),cats:new Set(CA.slice(0,5)),hr:true,add:new Set(),rm:new Set(),abs:0,run:1,sat:false,q:'',cell:null,cl:0,te:names[0],pv:'',sk:null,so:false,fo:false,fk:null};
function derived(){const o=new Set();for(const k of S.sc){const[ty,v]=k.split(':'),m=(g,b)=>g&&(k=='all'||(ty=='g'?g==v:b==v));
for(const n in T)if(T[n].tch.some(e=>m(e[0],e[1])&&S.cats.has(e[2])))o.add(n);
if(S.hr)C.forEach(c=>{if(c.hr&&T[c.hr]&&m(c.g,c.b))o.add(c.hr)})}return o}
function sel(){const d=derived();S.add.forEach(n=>d.add(n));S.rm.forEach(n=>d.delete(n));return names.filter(n=>d.has(n))}
const tbl=(f,days)=>{let h='<table class="g"><tr><th></th>'+DAYS.slice(0,days).map(d=>`<th>週${d}</th>`).join('')+'</tr>';
for(let p=1;p<=8;p++){h+=`<tr class="${p==5?'lunch':''}"><th>第${p}節<br><small>${PT[p-1][0]}</small></th>`;for(let d=0;d<days;d++)h+=`<td>${f(d,p)}</td>`;h+='</tr>'}return h+'</table>'};
const chip=(a,k,l,on)=>`<button class="chip ${on?'on':''}" data-a="${a}" data-k="${k}">${l}</button>`;
function chips(){const sl=sel();
$('c1').innerHTML=chip('sc','all','全校',S.sc.has('all'))+G.map(g=>chip('sc','g:'+g,g+'全部',S.sc.has('g:'+g))).join('')+'<br>'+B.map(b=>chip('sc','c:'+b,b,S.sc.has('c:'+b))).join('');
$('c2').innerHTML=CA.map(c=>chip('cat',c,c=='其他'?'其他(藝術等)':c,S.cats.has(c))).join('')+`<label style="margin-left:4px"><input type="checkbox" data-a="hr" ${S.hr?'checked':''}> 含導師</label>`;
$('cnt').innerHTML=`已選 <b>${sl.length}</b> 位老師`;
const ss=new Set(sl);$('tl').innerHTML=names.filter(n=>n.includes(S.q)).map(n=>`<button class="tp ${ss.has(n)?'on':''}" data-a="t" data-k="${n}">${n}</button>`).join('')}
function meet(){const sl=sel(),n=sl.length,days=S.sat?6:5,bz={};
const ctl=`<div class="ctl"><span>允許缺席 <button class="ct" data-a="abs" data-k="-1">−</button> <b>${S.abs}</b> 人 <button class="ct" data-a="abs" data-k="1">＋</button></span><span>連續 <span class="seg">${[1,2,3].map(r=>`<button class="${S.run==r?'on':''}" data-a="run" data-k="${r}">${r}</button>`).join('')}</span> 節</span><label><input type="checkbox" data-a="sat" ${S.sat?'checked':''}> 含週六</label></div>`;
if(!n){$('meet').innerHTML=ctl+'<p class="hint">請先在左邊點選範圍（例如「高三全部」或「國二忠班」）、科目或個別老師，這裡就會顯示大家的共同空堂。</p>'+pv();return}
for(let d=0;d<days;d++)for(let p=1;p<=8;p++)bz[d+'_'+p]=sl.filter(t=>T[t].busy[d+'_'+p]);
const good=(d,p)=>bz[d+'_'+p].length<=S.abs,runs=[],okc=new Set();
for(let d=0;d<days;d++)for(const[a,b]of[[1,4],[5,8]]){let p=a;while(p<=b){if(!good(d,p)){p++;continue}let q=p;while(q<b&&good(d,q+1))q++;
if(q-p+1>=S.run){let m=0;for(let x=p;x<=q;x++){m=Math.max(m,bz[d+'_'+x].length);okc.add(d+'_'+x)}runs.push({d,p,q,m})}p=q+1}}
runs.sort((a,b)=>a.m-b.m||(b.q-b.p)-(a.q-a.p)||a.d-b.d||a.p-b.p);
const lab=r=>`週${DAYS[r.d]} 第${r.p}${r.q>r.p?'–'+r.q:''}節 ${PT[r.p-1][0]}–${PT[r.q-1][1]}`;S.txt=runs.slice(0,8).map(lab).join('\n')+'\n與會：'+sl.join('、');
let h=ctl+`<div class="scroll">${tbl((d,p)=>{const k=d+'_'+p,f=n-bz[k].length;return`<button class="m ${okc.has(k)?'ok':''} ${S.cell==k?'sel':''}" data-a="cell" data-k="${k}" style="--f:${f/n}">${f}<i>/${n}</i></button>`},days)}</div>`;
h+=`<h2>${runs.length?'可開會時段（綠框）':'目前沒有符合的時段，可提高「允許缺席」人數'}${runs.length?` <button class="ct" data-a="copy">複製時段與名單</button>`:''}</h2><ul class="r">${runs.slice(0,12).map(r=>`<li><button data-a="cell" data-k="${r.d}_${r.p}">${lab(r)}<small>${r.m?'最多缺 '+r.m+' 人':'全員有空'}</small></button></li>`).join('')}</ul>`;
if(S.cell&&bz[S.cell]){const[d,p]=S.cell.split('_'),b=bz[S.cell];h+=`<div class="det"><b>週${DAYS[+d]} 第${p}節 ${PT[p-1][0]}–${PT[p-1][1]}</b>：${b.length?`<div class="bz">有課 ${b.length} 人</div>`+b.map(t=>`<div>${t}　<span class="fr">${T[t].busy[S.cell].map(x=>x.c+' '+x.s).join('、')}</span></div>`).join(''):'全員有空'}<div class="fr">有空：${sl.filter(t=>!b.includes(t)).join('、')||'—'}</div><button class="ct" data-a="toSlot" data-k="${S.cell}" style="margin-top:6px">看全校這節誰上課</button></div>`}
h+=pv();$('meet').innerHTML=h}
const clsGrid=(i,pv)=>{const c=C[i],m={},ln=t=>`<a data-a="${pv?'pv':'goT'}" data-k="${pv?'t:':''}${t}">${t}</a>`;c.x.forEach(x=>m[x[1]+'_'+x[0]]=x);
return tbl((d,p)=>{const x=m[d+'_'+p];return x?`<div class="cell"><b>${x[2]}</b><br>${x[4].map(ln).join('')}${x[3]?`<small>${x[3]}</small>`:''}</div>`:'<div class="cell e"></div>'},6)};
function tlist(is,pvm){const m={};is.forEach(i=>C[i].x.forEach(x=>x[4].forEach(t=>(m[t]||(m[t]=new Set())).add(x[2].replace(/[()*（）]/g,'')))));
const hr=new Set(is.map(i=>C[i].hr)),ix=t=>Math.min(...[...m[t]].map(s=>CA.indexOf(cat(s)))),ts=Object.keys(m).sort((a,b)=>ix(a)-ix(b)||a.localeCompare(b,'zh-Hant'));
return`<div class="tls">${ts.map(t=>`<div><a data-a="${pvm?'pv':'goT'}" data-k="${pvm?'t:':''}${t}">${t}</a>${hr.has(t)?'<em>導師</em>':''}<span>${[...m[t]].join('、')}</span></div>`).join('')}</div>`}
const teaGrid=n=>{const t=T[n];return tbl((d,p)=>{const b=t.busy[d+'_'+p];return b?`<div class="cell">${b.map(x=>`<b>${x.c}</b><small>${x.s}</small>`).join('')}</div>`:'<div class="cell e"></div>'},6)};
function cls(){const c=C[S.cl];$('cg').innerHTML=`<p class="hint" style="padding:0 0 8px">導師：${c.hr||'—'}（點老師姓名可看他的課表）</p>`+'<h2>任課老師與科目</h2>'+tlist([S.cl])+'<h2>課表</h2>'+clsGrid(S.cl)}
function tea(){$('tg').innerHTML=teaGrid(S.te)}
function pv(){const sl=sel();let h='<h2>課表預覽<small>點班級或老師，就在這裡看課表</small></h2><div class="chips">'+B.map(b=>chip('pv','c:'+b,b,S.pv==='c:'+b)).join('')+'</div>';
if(sl.length)h+='<div class="chips">'+sl.map(t=>chip('pv','t:'+t,t,S.pv==='t:'+t)).join('')+'</div>';
h+=`<select data-a="pvs"><option value="">看其他老師…</option>${names.map(n=>`<option>${n}</option>`).join('')}</select>`;
if(S.pv){const[ty,v]=[S.pv.slice(0,1),S.pv.slice(2)];h+=ty=='t'?`<div class="det"><b>${v}</b> 老師的課表</div><div class="scroll">${teaGrid(v)}</div>`:C.map((c,i)=>c.b==v?`<div class="det"><b>${c.n}</b>　導師：${c.hr||'—'}　<button class="ct" data-a="addcls" data-k="${i}">把這班老師加入左邊名單</button></div><h2>任課老師與科目<small>點姓名看他的課表</small></h2>${tlist([i],1)}<h2>課表</h2><div class="scroll">${clsGrid(i,1)}</div>`:'').join('')}
return h}
const SL={};C.forEach(c=>c.x.forEach(([p,d,s,r,ts])=>ts.forEach(t=>(SL[d+'_'+p]||(SL[d+'_'+p]=[])).push({t,c:c.n,s,r}))));
function slot(){const sl=new Set(sel()),only=S.so&&sl.size>0,get=k=>(SL[k]||[]).filter(e=>!only||sl.has(e.t)),cn=k=>new Set(get(k).map(e=>e.t)).size;
let mx=1;for(let d=0;d<6;d++)for(let p=1;p<=8;p++)mx=Math.max(mx,cn(d+'_'+p));
let h=`<div class="ctl"><span>點下方任一節，列出那節有課的老師</span><label><input type="checkbox" data-a="so" ${S.so?'checked':''}> 只看已選的 ${sl.size} 位老師</label></div><div class="scroll">${tbl((d,p)=>{const k=d+'_'+p;return`<button class="m ${S.sk==k?'sel':''}" data-a="sk" data-k="${k}" style="--f:${cn(k)/mx}">${cn(k)}<i>位</i></button>`},6)}</div>`;
if(S.sk){const[d,p]=S.sk.split('_'),es=get(S.sk),ts=[...new Set(es.map(e=>e.t))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));S.stxt=`週${DAYS[+d]} 第${p}節上課老師：`+ts.join('、');
h+=`<div class="det"><b>週${DAYS[+d]} 第${p}節 ${PT[p-1][0]}–${PT[p-1][1]}</b>　${ts.length} 位老師上課 <button class="ct" data-a="copyS">複製名單</button><div class="chips" style="margin:8px 0">${ts.map(t=>`<button class="tp" data-a="goT" data-k="${t}">${t}</button>`).join('')}</div>${es.map(e=>`<div><span class="fr">${e.c}　${e.s}${e.r?'（'+e.r+'）':''}</span>　${e.t}</div>`).join('')}</div>`}
$('slot').innerHTML=h}
function fre(){const sl=new Set(sel()),only=S.fo&&sl.size>0,U=names.filter(n=>!only||sl.has(n)),fr=k=>U.filter(n=>!T[n].busy[k]);
let h=`<div class="ctl"><span>點下方任一節，列出那節沒課的老師</span><label><input type="checkbox" data-a="fo" ${S.fo?'checked':''}> 只看已選的 ${sl.size} 位老師</label></div><div class="scroll">${tbl((d,p)=>{const k=d+'_'+p,n=fr(k).length;return`<button class="m ${S.fk==k?'sel':''}" data-a="fk" data-k="${k}" style="--f:${U.length?n/U.length:0}">${n}<i>位</i></button>`},6)}</div>`;
if(S.fk){const[d,p]=S.fk.split('_'),ts=fr(S.fk);S.ftxt=`週${DAYS[+d]} 第${p}節沒課的老師：`+ts.join('、');
h+=`<div class="det"><b>週${DAYS[+d]} 第${p}節 ${PT[p-1][0]}–${PT[p-1][1]}</b>　${ts.length} 位老師沒課 <button class="ct" data-a="copyF">複製名單</button><div class="chips" style="margin-top:8px">${ts.map(t=>`<button class="tp" data-a="goT" data-k="${t}">${t}</button>`).join('')||'<span class="fr">沒有符合的老師</span>'}</div></div>`}
$('fr').innerHTML=h}
function fillT(q=''){const l=names.filter(n=>n.includes(q));$('ts').innerHTML=l.length?l.map(n=>`<option${n==S.te?' selected':''}>${n}</option>`).join(''):'<option disabled selected>找不到符合的老師</option>';if(l.length&&!l.includes(S.te)){S.te=l[0];tea();$('ts').value=S.te}}
function all(){chips();meet();slot();fre()}
$('cs').innerHTML=C.map((c,i)=>`<option value="${i}">${c.n}${c.hr?'（導師 '+c.hr+'）':''}</option>`).join('');fillT();
$('cs').onchange=e=>{S.cl=+e.target.value;cls()};$('tq').oninput=e=>fillT(e.target.value.trim());$('ts').onchange=e=>{S.te=e.target.value;tea()};$('q').oninput=e=>{S.q=e.target.value.trim();chips()};
document.addEventListener('change',e=>{const a=e.target.dataset.a;if(a=='hr')S.hr=e.target.checked;else if(a=='sat')S.sat=e.target.checked;else if(a=='so')S.so=e.target.checked;else if(a=='fo')S.fo=e.target.checked;else if(a=='pvs'){if(!e.target.value)return;S.pv='t:'+e.target.value}else return;all()});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-a],a[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k;
if(a=='sc')S.sc.has(k)?S.sc.delete(k):S.sc.add(k);
else if(a=='cat')S.cats.has(k)?S.cats.delete(k):S.cats.add(k);
else if(a=='t'){if(sel().includes(k)){S.add.delete(k);S.rm.add(k)}else{S.rm.delete(k);S.add.add(k)}}
else if(a=='clr'){S.sc.clear();S.add.clear();S.rm.clear();S.cell=null}
else if(a=='abs')S.abs=Math.max(0,S.abs+ +k);
else if(a=='run')S.run=+k;
else if(a=='cell')S.cell=k;
else if(a=='pv')S.pv=k;
else if(a=='addcls')C[+k].x.forEach(x=>x[4].forEach(t=>{S.add.add(t);S.rm.delete(t)}));
else if(a=='sk')S.sk=k;
else if(a=='fk')S.fk=k;
else if(a=='copyF'){try{navigator.clipboard.writeText(S.ftxt).then(()=>b.textContent='已複製')}catch(_){prompt('請複製：',S.ftxt)};return}
else if(a=='toSlot'){S.sk=k;all();a2('slot');return}
else if(a=='copyS'){try{navigator.clipboard.writeText(S.stxt).then(()=>b.textContent='已複製')}catch(_){prompt('請複製：',S.stxt)};return}
else if(a=='copy'){try{navigator.clipboard.writeText(S.txt).then(()=>b.textContent='已複製')}catch(_){prompt('請複製：',S.txt)};return}
else if(a=='goT'){S.te=k;$('tq').value='';fillT();tea();a2('tea');return}
else if(a=='tab'){a2(k);return}
all()});
function a2(k){['meet','cls','tea','slot','fr'].forEach(i=>$(i).hidden=i!=k);document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.k==k))}
all();cls();tea();
</script></body></html>
